<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>中國象棋線上對弈 | Chinese Chess Web App</title>
    <meta name="description" content="網頁版獨立中國象棋棋盤應用。支援瀏覽器隨開隨玩、線上連線對戰。無論是棋藝切磋還是日常休閒消遣，都能享受流暢寫實的對弈體驗。">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: #f0f0f0; 
            width: 100vw;
            height: 100vh;
            padding: 8px;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        h1 { font-size: 1.2rem; color: #333; margin-bottom: 5px; }
        
        #connection-panel { 
            background: #fff; 
            padding: 8px 12px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 100%;
            max-width: 400px;
        }
        #status { font-size: 0.9rem; font-weight: bold; color: #cc0000; line-height: 1.3; }
        #input-area { margin-top: 6px; }
        input, button { padding: 6px 10px; font-size: 0.85rem; border-radius: 4px; border: 1px solid #ccc; margin: 2px; }
        button { background: #cc0000; color: white; cursor: pointer; border: none; font-weight: bold; }
        
        /* 棋盤主容器 */
        .chessboard-container { 
            position: relative; 
            background-color: #fabd66; 
            border: 4px double #8a5216; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            border-radius: 4px;
            width: 84vmin; 
            height: calc(84vmin * 1.11); 
            max-width: 500px;
            max-height: calc(500px * 1.11);
            padding: calc(100% / 10 / 2) calc(100% / 9 / 2);
        }

        /* 格線網格 */
        .board-lines { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            grid-template-rows: repeat(9, 1fr); 
            width: calc(100% - (100% / 9));
            height: calc(100% - (100% / 10));
            position: absolute;
            top: calc(100% / 10 / 2); 
            left: calc(100% / 9 / 2);
            pointer-events: none;
        }
        .cell { border: 1px solid #8a5216; }
        
        /* 楚河漢界 */
        .river { 
            grid-column: span 8; 
            border: 1px solid #8a5216; 
            text-align: center; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem; 
            font-weight: bold; 
            color: #8a5216; 
            letter-spacing: 8px; 
            background-color: #fabd66;
            z-index: 1;
        }
        
        /* 棋子與點擊事件圖層 */
        .pieces-layer { 
            position: absolute; 
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: grid; 
            grid-template-columns: repeat(9, 1fr); 
            grid-template-rows: repeat(10, 1fr); 
            z-index: 10;
        }
        
        .intersection { 
            width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; position: relative; 
        }
        
        /* 棋子主體 */
        .piece { 
            width: 85%; 
            aspect-ratio: 1 / 1;
            border-radius: 50%; 
            background-color: #f7e6c4; 
            border: 1.5px solid #555; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 1.25rem; font-weight: bold; 
            box-shadow: 1px 1px 4px rgba(0,0,0,0.3); 
            z-index: 20; 
            pointer-events: none;
        }
        .piece.red { color: #cc0000; border-color: #cc0000; }
        .piece.black { color: #000000; border-color: #000000; }
        
        .intersection.selected .piece { transform: scale(1.1); box-shadow: 0 0 8px #ff9900; border-color: #ff9900; }
        
        /* 最後落子步跡高亮效果 */
        .intersection.last-move::after {
            content: '';
            position: absolute;
            width: 88%;
            height: 88%;
            border: 3px dashed #ff9900;
            border-radius: 50%;
            z-index: 11;
            box-shadow: inset 0 0 8px rgba(255, 153, 0, 0.6);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        /* 可走位置提示點 */
        .intersection.highlight::after { 
            content: ''; 
            width: 25%; 
            aspect-ratio: 1 / 1;
            background-color: rgba(0, 180, 0, 0.75); border-radius: 50%; 
            position: absolute; z-index: 15; 
        }

        /* 彈出勝負視窗 */
        #game-over-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 999; justify-content: center; align-items: center;
            flex-direction: column; color: white;
        }
        #game-over-box { background: white; padding: 25px; border-radius: 12px; text-align: center; color: #333; max-width: 300px; width: 80%; }
        #game-over-title { font-size: 1.6rem; font-weight: bold; margin-bottom: 15px; color: #cc0000; }
    </style>

</head>
<body>

    <h1>中國象棋連線對弈版</h1>
    
    <div id="connection-panel">
        <div id="status">【單機試玩】輸入自訂房號即可連線</div>
        <div id="input-area">
            <input type="number" id="room-input" placeholder="輸入自訂房號 (如 7788)" style="width: 160px; text-align: center;">
            <button onclick="joinRoom('R')">執紅入房</button>
            <button onclick="joinRoom('B')" style="background:#333;">執黑入房</button>
        </div>
    </div>

    <div class="chessboard-container">
        <div class="board-lines" id="lines-grid"></div>
        <div class="pieces-layer" id="pieces-layer"></div>
    </div>

    <div id="game-over-modal">
        <div id="game-over-box">
            <div id="game-over-title">紅方大獲全勝！</div>
            <button onclick="restartGame()" style="padding: 8px 20px; font-size: 1rem;">重新棋局</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeepSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08); 
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        function playVictorySound() {
            const notes = [523.25, 659.25, 783.99, 1046.50]; 
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.08);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5 + index * 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + index * 0.08);
                osc.stop(audioCtx.currentTime + 0.5 + index * 0.08);
            });
        }

        const initialBoard = [
            ['B車', 'B馬', 'B象', 'B士', 'B將', 'B士', 'B象', 'B馬', 'B車'],
            [ null,  null,  null,  null,  null,  null,  null,  null,  null],
            [ null, 'B砲',  null,  null,  null,  null,  null, 'B砲',  null],
            ['B卒',  null, 'B卒',  null, 'B卒',  null, 'B卒',  null, 'B卒'],
            [ null,  null,  null,  null,  null,  null,  null,  null,  null],
            [ null,  null,  null,  null,  null,  null,  null,  null,  null],
            ['R兵',  null, 'R兵',  null, 'R兵',  null, 'R兵',  null, 'R兵'],
            [ null, 'R砲',  null,  null,  null,  null,  null, 'R砲',  null],
            [ null,  null,  null,  null,  null,  null,  null,  null,  null],
            ['R車', 'R馬', 'R相', 'R仕', 'R帥', 'R仕', 'R相', 'R馬', 'R車']
        ];

        let board = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'R'; 
        let selectedIndex = null;
        let validMoves = []; 
        let gameActive = true;

        let lastMove = null; 

        let client = null;
        let roomNumber = "";
        let mySide = 'BOTH'; 
        let isP2PConnected = false; 

        let peerConnection = null;
        let dataChannel = null;
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        const piecesLayer = document.getElementById('pieces-layer');
        const linesGrid = document.getElementById('lines-grid');
        const statusDiv = document.getElementById('status');
        const inputArea = document.getElementById('input-area');

        function joinRoom(side) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const room = document.getElementById('room-input').value.trim();
            if(!room) return alert("請輸入房號！");
            roomNumber = room;
            mySide = side;

            statusDiv.innerText = "正在連線到安全雲端節點...";
            const clientId = "xq_" + Math.random().toString(36).substring(7);
            
            client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), clientId);

            client.onConnectionLost = (responseObject) => { 
                console.log("MQTT Connection Lost.");
                if (mySide !== 'BOTH' && !isP2PConnected) {
                    statusDiv.innerText = "⚠️ 網絡出現微弱波動，正在自動秒級重連...";
                    setTimeout(() => {
                        if(client && !client.isConnected()) tryReconnect();
                    }, 1000);
                }
            };

            client.onMessageArrived = async (message) => {
                const data = JSON.parse(message.payloadString);
                if (data.sender === client.clientId) return; 
                
                if (data.type === 'GAME_MOVE' && !isP2PConnected) {
                    handleIncomingGameData(data);
                    return;
                }
                if (data.type === 'GAME_RESET' && !isP2PConnected) {
                    handleIncomingGameData({ type: 'RESET' });
                    return;
                }

                if (data.type === 'RTC_OFFER' && mySide === 'B') {
                    await initWebRTC(false);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    sendSignal({ type: 'RTC_ANSWER', answer: answer });
                } 
                else if (data.type === 'RTC_ANSWER' && mySide === 'R') {
                    if(peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                } 
                else if (data.type === 'RTC_ICE') {
                    if (peerConnection && peerConnection.remoteDescription) {
                        try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
                    }
                }
                else if (data.type === 'BLACK_JOINED' && mySide === 'R') {
                    initWebRTC(true);
                }
            };

            doConnect();
        }

        function doConnect() {
            client.connect({
                onSuccess: () => {
                    client.subscribe("xiangqi/room/" + roomNumber);
                    if (mySide === 'R') {
                        statusDiv.innerText = `已入房間【${roomNumber}】| 等待黑方加入...`;
                    } else {
                        statusDiv.innerText = `已入房間【${roomNumber}】| 正在嘗試建立連線...`;
                        sendSignal({ type: 'BLACK_JOINED' });
                    }
                    
                    setTimeout(() => {
                        if (!isP2PConnected && mySide !== 'BOTH') {
                            statusDiv.innerText = `【房號 ${roomNumber}】🌐 已啟動雲端高可用防斷線備用模式`;
                            document.getElementById('connection-panel').style.background = "#fff9e6";
                            inputArea.style.display = 'none'; // 成功連線，隱藏輸入框與按鈕
                            renderBoard();
                        }
                    }, 4000);

                    renderBoard();
                },
                onFailure: () => { 
                    statusDiv.innerText = "連線失敗，5秒後重試..."; 
                    setTimeout(doConnect, 5000);
                },
                useSSL: true,
                keepAliveInterval: 30,
                timeout: 10
            });
        }

        function tryReconnect() {
            if(client) {
                client.connect({
                    onSuccess: () => {
                        client.subscribe("xiangqi/room/" + roomNumber);
                        if (isP2PConnected) return;
                        statusDiv.innerText = `【房號 ${roomNumber}】🌐 雲端防斷線備用模式已成功自動回復！`;
                        inputArea.style.display = 'none'; 
                        renderBoard();
                    },
                    onFailure: () => { setTimeout(tryReconnect, 3000); },
                    useSSL: true,
                    keepAliveInterval: 30
                });
            }
        }

        async function initWebRTC(isInitiator) {
            if(peerConnection) return;
            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) sendSignal({ type: 'RTC_ICE', candidate: event.candidate });
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    isP2PConnected = true;
                    document.getElementById('connection-panel').style.background = "#e6ffe6";
                    inputArea.style.display = 'none'; // 成功直連，隱藏輸入按鈕
                    renderBoard();
                }
            };

            if (isInitiator) {
                dataChannel = peerConnection.createDataChannel("xiangqiGameChannel");
                setupDataChannel();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                sendSignal({ type: 'RTC_OFFER', offer: offer });
            } else {
                peerConnection.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    setupDataChannel();
                };
            }
        }

        function setupDataChannel() {
            dataChannel.onopen = () => {
                isP2PConnected = true;
                document.getElementById('connection-panel').style.background = "#e6ffe6";
                inputArea.style.display = 'none'; // 成功直連，隱藏輸入按鈕
                renderBoard();
            };
            dataChannel.onmessage = (event) => {
                handleIncomingGameData(JSON.parse(event.data));
            };
        }

        function sendSignal(payload) {
            if (client && client.isConnected()) {
                payload.sender = client.clientId;
                const message = new Paho.MQTT.Message(JSON.stringify(payload));
                message.destinationName = "xiangqi/room/" + roomNumber;
                client.send(message);
            }
        }

        function handleIncomingGameData(data) {
            board = data.board;
            turn = data.turn;
            gameActive = data.gameActive;
            selectedIndex = null;
            validMoves = [];
            lastMove = data.lastMove || null;

            renderBoard();
            playBeepSound(); 
            if (!gameActive && data.winner) showGameOver(data.winner);
        }

        function sendMoveData(finalWinner) {
            const payload = {
                type: 'GAME_MOVE',
                board: board,
                turn: turn,
                gameActive: gameActive,
                winner: finalWinner,
                lastMove: lastMove
            };

            if (isP2PConnected && dataChannel && dataChannel.readyState === "open") {
                dataChannel.send(JSON.stringify(payload));
            } else {
                sendSignal(payload); 
            }
        }

        function sendResetSignal() {
            if (isP2PConnected && dataChannel && dataChannel.readyState === "open") {
                dataChannel.send(JSON.stringify({ type: 'RESET' }));
            } else {
                sendSignal({ type: 'GAME_RESET' });
            }
        }

        function checkGameOver() {
            let hasRedKing = false, hasBlackKing = false;
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] === 'R帥') hasRedKing = true;
                    if (board[r][c] === 'B將') hasBlackKing = true;
                }
            }
            if (!hasRedKing) return 'B'; 
            if (!hasBlackKing) return 'R'; 
            return null;
        }

        function showGameOver(winner) {
            gameActive = false;
            playVictorySound();
            const title = document.getElementById('game-over-title');
            title.innerText = winner === 'R' ? "紅方大獲全勝！" : "黑方大獲全勝！";
            title.style.color = winner === 'R' ? "#cc0000" : "#000";
            document.getElementById('game-over-modal').style.display = 'flex';
        }

        function restartGame() {
            if (mySide !== 'BOTH') {
                sendResetSignal();
            }
            board = JSON.parse(JSON.stringify(initialBoard));
            turn = 'R'; gameActive = true; selectedIndex = null; validMoves = []; lastMove = null;
            document.getElementById('game-over-modal').style.display = 'none';
            renderBoard();
        }

        function isValidMove(fromR, fromC, toR, toC) {
            const piece = board[fromR][fromC];
            if (!piece) return false;
            const color = piece[0], type = piece[1], target = board[toR][toC];
            if (target && target[0] === color) return false; 

            const dr = toR - fromR, dc = toC - fromC, absDr = Math.abs(dr), absDc = Math.abs(dc);

            function countPiecesBetween(fR, fC, tR, tC) {
                let count = 0;
                if (fR === tR) {
                    const minC = Math.min(fC, tC), maxC = Math.max(fC, tC);
                    for (let c = minC + 1; c < maxC; c++) if (board[fR][c]) count++;
                } else if (fC === tC) {
                    const minR = Math.min(fR, tR), maxR = Math.max(fR, tR);
                    for (let r = minR + 1; r < maxR; r++) if (board[r][fC]) count++;
                }
                return count;
            }

            switch (type) {
                case '將': case '帥':
                    if (toC < 3 || toC > 5) return false;
                    if (color === 'R' && (toR < 7 || toR > 9)) return false;
                    if (color === 'B' && (toR < 0 || toR > 2)) return false;
                    return (absDr + absDc === 1);
                case '士': case '仕':
                    if (toC < 3 || toC > 5) return false;
                    if (color === 'R' && (toR < 7 || toR > 9)) return false;
                    if (color === 'B' && (toR < 0 || toR > 2)) return false;
                    return (absDr === 1 && absDc === 1);
                case '象': case '相':
                    if (color === 'R' && toR < 5) return false;
                    if (color === 'B' && toR > 4) return false;
                    if (absDr === 2 && absDc === 2) return !board[fromR + dr / 2][fromC + dc / 2];
                    return false;
                case '馬':
                    if (absDr === 2 && absDc === 1) return !board[fromR + dr / 2][fromC];
                    if (absDr === 1 && absDc === 2) return !board[fromR][fromC + dc / 2];
                    return false;
                case '車':
                    if (fromR !== toR && fromC !== toC) return false;
                    return countPiecesBetween(fromR, fromC, toR, toC) === 0;
                case '砲': case '炮':
                    if (fromR !== toR && fromC !== toC) return false;
                    const cnt = countPiecesBetween(fromR, fromC, toR, toC);
                    if (!target) return cnt === 0;
                    return cnt === 1;
                case '兵': case '卒':
                    if (color === 'R') {
                        if (dr > 0) return false;
                        if (fromR >= 5) return (dr === -1 && dc === 0);
                        return (absDr + absDc === 1 && dr <= 0);
                    } else {
                        if (dr < 0) return false;
                        if (fromR <= 4) return (dr === 1 && dc === 0);
                        return (absDr + absDc === 1 && dr >= 0);
                    }
            }
            return false;
        }

        function getValidMoves(r, c) {
            let moves = [];
            for (let toR = 0; toR < 10; toR++) {
                for (let toC = 0; toC < 9; toC++) {
                    if (isValidMove(r, c, toR, toC)) moves.push({ row: toR, col: toC });
                }
            }
            return moves;
        }

        function renderBoardLines() {
            linesGrid.innerHTML = '';
            let html = '';
            for(let i=0; i<32; i++) html += '<div class="cell"></div>';
            
            html += `<div class="river">楚河&nbsp;&nbsp;漢界</div>`;
            
            for(let i=0; i<32; i++) html += '<div class="cell"></div>';
            linesGrid.innerHTML = html;
        }

        function renderBoard() {
            renderBoardLines();
            piecesLayer.innerHTML = '';
            const isBlackView = (mySide === 'B');

            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 9; j++) {
                    const r = isBlackView ? (9 - i) : i;
                    const c = isBlackView ? (8 - j) : j;

                    const intersection = document.createElement('div');
                    intersection.className = 'intersection';
                    
                    const pieceText = board[r][c];
                    if (pieceText) {
                        const pieceDiv = document.createElement('div');
                        const isRed = pieceText.startsWith('R');
                        pieceDiv.className = `piece ${isRed ? 'red' : 'black'}`;
                        pieceDiv.innerText = pieceText.substring(1);
                        intersection.appendChild(pieceDiv);
                    }

                    if (selectedIndex && selectedIndex.row === r && selectedIndex.col === c) {
                        intersection.classList.add('selected');
                    }

                    if (lastMove && ((lastMove.from.row === r && lastMove.from.col === c) || (lastMove.to.row === r && lastMove.to.col === c))) {
                        intersection.classList.add('last-move');
                    }

                    const isPossibleMove = validMoves.some(m => m.row === r && m.col === c);
                    if (isPossibleMove) intersection.classList.add('highlight');

                    intersection.addEventListener('click', () => handleCellClick(r, c));
                    piecesLayer.appendChild(intersection);
                }
            }
            
            let turnTxt = turn === 'R' ? "紅方" : "黑方";

            if (mySide !== 'BOTH') {
                let p2pStatus = isP2PConnected ? "🟢 P2P 直連中" : "🌐 雲端連線中";
                statusDiv.innerHTML = `【房號 ${roomNumber}】${p2pStatus} | 輪到：${turnTxt} ${turn === mySide ? '（到你行！）' : '（等緊對方...）'}`;
                inputArea.style.display = 'none'; // 安全計，每次重新 render 時確認連線就隱藏輸入框
            } else {
                statusDiv.innerHTML = `【單機】輪到：${turnTxt}`;
            }
        }

        function handleCellClick(row, col) {
            if (!gameActive) return;
            if (mySide !== 'BOTH' && turn !== mySide) return; 
            const piece = board[row][col];

            if (selectedIndex) {
                const isLegal = validMoves.some(m => m.row === row && m.col === col);
                if (isLegal) {
                    const movingPiece = board[selectedIndex.row][selectedIndex.col];

                    lastMove = {
                        from: { row: selectedIndex.row, col: selectedIndex.col },
                        to: { row: row, col: col }
                    };

                    board[row][col] = movingPiece;
                    board[selectedIndex.row][selectedIndex.col] = null;
                    
                    playBeepSound(); 

                    const winner = checkGameOver();
                    if (winner) gameActive = false; else turn = turn === 'R' ? 'B' : 'R';

                    selectedIndex = null; validMoves = [];
                    renderBoard();
                    
                    if (mySide !== 'BOTH') sendMoveData(winner); 
                    if (!gameActive) showGameOver(winner);
                } else if (piece && piece.startsWith(turn)) {
                    selectedIndex = { row, col }; validMoves = getValidMoves(row, col); renderBoard();
                } else {
                    selectedIndex = null; validMoves = []; renderBoard();
                }
            } else {
                if (piece && piece.startsWith(turn)) {
                    selectedIndex = { row, col }; validMoves = getValidMoves(row, col); renderBoard();
                }
            }
        }

        renderBoard();
    </script>
</body>
</html>
